
name: CD/CD Pipeline

on: 
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Verify files exist
        run: |
          echo "Listing project files:"
          ls -la
      
          
      - name: Run app.js
        run: node app.js
        run: |
          echo "Running app.js..."
          

